<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./etch.js" defer></script>
    <title>Etch-a-Sketch</title>
</head>
<body>
    <div class="header">
        <div class="title">Etch a Sketch!</div>
        <div class="home">Home</div>
    </div>
    <div class="game-container">
        <div class="button-container">
            <input type="color" name="color-picker" class="color-picker"> 
            <label for="color-picker">Pick a colour!</label>
            <button class="reset">Reset</button>
            <div class="pixel-number-container">
                <input type="range" class="pixel-number" name="pixel-number" min="4" max="64">
                <div class="pixel-number-display">32 x 32</div>
            </div>
            <button class="rgb-button">Rainbow!</button>
        </div>
        <div class="sketchboard-container">
            <div class="sketchboard"></div>
        </div>
    </div>
</body>
</html>
